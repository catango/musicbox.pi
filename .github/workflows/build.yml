name: Build musicbox.pi
run-name: build and upload musicbox.pi raspberrypi image
on: 
  pull_request:
  push:
    paths-ignore:
      - .github/workflows/lint.yml
      - LICENSE
      - README.md

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: musicbox.pi
          pi-gen-release: Musicbox.pi
          pi-gen-version: 2025-12-04-raspios-trixie-arm64
          # 2026-04-13 version does not build due to issues with binfmt on default github runner
          #pi-gen-version: 2026-04-13-raspios-trixie-arm64
          release: trixie
          locale: en_US.UTF-8
          hostname: musicbox.pi
          keyboard-keymap: de
          timezone: Europe/Berlin
          enable-ssh: 1
          wpa-country: DE
          stage-list: stage0 stage1 stage2 ./stage2-musicbox

      - uses: actions/upload-artifact@v6
        with:
          name: musicbox.pi-image
          path: ${{ steps.build.outputs.image-path }}
